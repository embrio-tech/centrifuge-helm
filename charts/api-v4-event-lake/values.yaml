# Producer identity. All required; the GitOps ApplicationSet maps them from the
# Producer object and its Environment.
environment: ""
network: ""
id: ""
# INDEX_GENERATION: topic infix and the Envio Postgres schema.
generation: ""
# Chain ids this Producer indexes, e.g. [11155111, 84532].
selectedNetworks: []
# Environment-owned event-lake database app Secret (keys: host, port, username,
# password, dbname).
databaseSecretName: ""
# Optional pre-deployed Secret with ENVIO_API_TOKEN and ENVIO_RPC_URL_<chainId>
# overrides. Its keys win over the ConfigMap.
envioSecretName: ""

image:
  repository: ghcr.io/centrifuge/event-lake
  digest: ""
  # Informational only; becomes the app.kubernetes.io/version label.
  displayTag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# In-cluster eRPC. `%s` is the chain id. Required: the Service name differs per
# region (cfg-api-erpc on eu, cfg-api-erpc-us on us).
erpc:
  urlTemplate: ""

global:
  # Runtime env for the indexer ConfigMap. Registry pins and REGISTRY_INCLUDE are
  # part of the Producer's identity and come from the Producer object.
  env:
    REDPANDA_BROKERS: "cfg-api-redpanda:9093"
    REDPANDA_SCHEMA_REGISTRY_URL: "http://cfg-api-redpanda:8081"
    LOG_LEVEL: "info"
    ENVIO_HASURA: "false"
    ENVIO_TUI: "false"
    ENVIO_HEALTH_PORT: "8080"
    IPFS_GATEWAY: "https://centrifuge-files.mypinata.cloud/ipfs"

# The image runs as root today, so runAsNonRoot is not set. Everything else that
# does not depend on the user is locked down.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

indexer:
  enabled: true
  replicaCount: 1
  # Creates this release's topics and schema subjects before the indexer rolls.
  # rpk is pinned to the cluster's Redpanda version; cfg-cli reconcile-topics
  # would create RF 1 topics.
  provision:
    rpk:
      repository: docker.redpanda.com/redpandadata/redpanda
      tag: "v26.1.14"
      pullPolicy: IfNotPresent
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
  podAnnotations: {}
  podLabels: {}
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests: { cpu: 500m, memory: 4Gi }
    limits: { cpu: "2", memory: 4Gi }
  # /health is liveness: 200 while the entrypoint or Envio HTTP is up (not healthz ok).
  # The entrypoint returns that 503 within 2s, so timeoutSeconds does not cover a stall.
  # failureThreshold 3 then SIGTERM during catch-up and drops the uncommitted checkpoint.
  # 18 failures at 10s is about 180s of consecutive 503s. One 200 clears the count.
  # /ready stays 503 until every selected chain is realtime. Readiness does not restart.
  startupProbe:
    httpGet: { path: /health, port: http }
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 60
  readinessProbe:
    httpGet: { path: /ready, port: http }
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  livenessProbe:
    httpGet: { path: /health, port: http }
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 18
  volumes: []
  volumeMounts: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  env: []
  envFrom: []
