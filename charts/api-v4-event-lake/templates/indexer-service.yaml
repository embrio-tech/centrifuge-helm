{{- if .Values.indexer.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "centrifuge-api-v4-event-lake.indexer.fullname" . }}
  labels:
    {{- include "centrifuge-api-v4-event-lake.indexer.labels" . | nindent 4 }}
spec:
  type: {{ .Values.indexer.service.type }}
  # The Projection gate polls /health before the indexer is Ready (origination
  # still catching up), so the endpoint must exist while the Pod is not ready.
  # The indexer has no other in-cluster consumer; the Pod is never removed from
  # the endpoints by readiness.
  publishNotReadyAddresses: true
  ports:
    - port: {{ .Values.indexer.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "centrifuge-api-v4-event-lake.indexer.selectorLabels" . | nindent 4 }}
{{- end }}
