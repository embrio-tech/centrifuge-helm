{{- if .Values.indexer.enabled }}
{{- $db := .Values.databaseSecretName }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "centrifuge-api-v4-event-lake.indexer.fullname" . }}
  labels:
    {{- include "centrifuge-api-v4-event-lake.indexer.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.indexer.replicaCount }}
  revisionHistoryLimit: 3
  # A full reindex can take hours before /ready turns 200.
  progressDeadlineSeconds: 43200
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "centrifuge-api-v4-event-lake.indexer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the Pod when env changes even though the ConfigMap is not a hook resource.
        checksum/config: {{ include "centrifuge-api-v4-event-lake.configData" . | sha256sum }}
        {{- with .Values.indexer.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "centrifuge-api-v4-event-lake.indexer.podLabels" . | nindent 8 }}
        {{- with .Values.indexer.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: indexer
          image: {{ include "centrifuge-api-v4-event-lake.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.indexer.service.port }}
              protocol: TCP
          {{- with .Values.indexer.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.indexer.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.indexer.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.indexer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.indexer.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- range $envKey, $secretKey := dict "ENVIO_PG_HOST" "host" "ENVIO_PG_PORT" "port" "ENVIO_PG_USER" "username" "ENVIO_PG_DATABASE" "dbname" "ENVIO_PG_PASSWORD" "password" }}
            - name: {{ $envKey }}
              valueFrom:
                secretKeyRef:
                  name: {{ $db | quote }}
                  key: {{ $secretKey }}
            {{- end }}
            {{- /* The event-lake image refuses to start on any other ENVIO_PG_SCHEMA. */}}
            - name: ENVIO_PG_SCHEMA
              value: {{ .Values.generation | replace "-" "_" | quote }}
            - name: INDEX_GENERATION
              value: {{ .Values.generation | quote }}
            - name: REDPANDA_CLIENT_ID
              value: {{ printf "envio-origination-%s-%s" .Values.environment .Values.id | quote }}
            - name: PRODUCER_ID
              value: {{ .Values.id | quote }}
            - name: API_V4_ENVIRONMENT
              value: {{ .Values.environment | quote }}
            {{- with .Values.indexer.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "centrifuge-api-v4-event-lake.configMapName" . }}
            {{- with .Values.envioSecretName }}
            # ENVIO_API_TOKEN plus optional ENVIO_RPC_URL_<chainId> overrides. Listed
            # after the ConfigMap so its keys win.
            - secretRef:
                name: {{ . | quote }}
            {{- end }}
            {{- with .Values.indexer.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- with .Values.indexer.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.indexer.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.indexer.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.indexer.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
