{{- include "centrifuge-api-v4-event-lake.validate" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "centrifuge-api-v4-event-lake.configMapName" . }}
  labels:
    {{- include "centrifuge-api-v4-event-lake.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  {{- include "centrifuge-api-v4-event-lake.configData" . | nindent 2 }}
