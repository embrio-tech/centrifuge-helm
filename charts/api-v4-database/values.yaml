# Required: public | event-lake
kind: ""
# Required: Environment ID, e.g. test-eu.
environment: ""

# CloudNative-PG cluster subchart (alias postgres). Only Environment-specific values
# are expected from GitOps: fullnameOverride, instances, storage, walStorage, roles,
# initdb and certificates.
postgres:
  # Required. Becomes the Cluster name and the <name>-app Secret prefix.
  fullnameOverride: ""
  type: postgresql
  mode: standalone
  backups:
    enabled: false
  cluster:
    instances: 1
    # Superuser login stays off; owner and role Secrets cover every workload.
    enableSuperuserAccess: false
    enablePDB: true
    annotations:
      # Argo CD never prunes or deletes the Cluster, even when the Application or
      # the chart stops rendering it. Removal is a manual, reviewed step.
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
    storage:
      size: 64Gi
      storageClass: ""
    walStorage:
      enabled: true
      size: 32Gi
      storageClass: ""
    resources:
      requests: { cpu: 250m, memory: 2Gi }
      limits: { cpu: "2", memory: 2Gi }
    affinity:
      topologyKey: topology.cinder.csi.openstack.org/zone
    certificates: {}
    # CNPG managed roles. Passwords come from pre-deployed basic-auth Secrets
    # (passwordSecret.name); this chart never renders Secret data.
    roles: []

# Internet SQL access through a dedicated PgBouncer. Public databases only.
sqlRo:
  enabled: false
  hostname: ""
  allowedCidrs:
    - 0.0.0.0/0
  service:
    type: LoadBalancer
    port: 5432
    annotations: {}
    loadBalancerSourceRanges: []
  pooler:
    name: sql-ro
    type: rw
    poolMode: session
    instances: 1
    parameters:
      max_client_conn: "16"
      default_pool_size: "8"
      ignore_startup_parameters: extra_float_digits
      server_idle_timeout: "0"
      client_idle_timeout: "0"
      server_lifetime: "0"
    pg_hba:
      - hostssl app public_ro 0.0.0.0/0 scram-sha-256
      - host all all 0.0.0.0/0 reject
