# Required: public | event-lake
kind: ""
environment: ""
network: ""
region: ""

nameOverride: ""
fullnameOverride: ""

# Pre-deployed credential Secrets. This chart never renders Secret values.
secrets:
  # CNPG still creates <cluster>-app; workloads reference that name from GitOps.
  querySecretName: ""
  activatorSecretName: ""
  publicRoSecretName: ""

postgres:
  # Always enabled. This chart exists only to own the Cluster.
  enabled: true
  cluster:
    instances: 1
    storage:
      size: 64Gi
      storageClass: ""
    walStorage:
      enabled: true
      size: 32Gi
      storageClass: ""
    resources:
      requests: { cpu: 250m, memory: 2Gi }
      limits: { cpu: "2", memory: 2Gi }
    affinity:
      topologyKey: topology.cinder.csi.openstack.org/zone
    roles: []

sqlRo:
  enabled: false
  hostname: ""
  annotations: {}
  service:
    type: LoadBalancer
    port: 5432
  pooler:
    name: sql-ro
    type: rw
    poolMode: session
    instances: 1
    parameters:
      max_client_conn: "16"
      default_pool_size: "8"
      ignore_startup_parameters: extra_float_digits
      server_idle_timeout: "0"
      client_idle_timeout: "0"
      server_lifetime: "0"
    pg_hba:
      - hostssl app public_ro 0.0.0.0/0 scram-sha-256
      - host all all 0.0.0.0/0 reject
