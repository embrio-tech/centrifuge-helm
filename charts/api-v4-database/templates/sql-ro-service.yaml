{{- if .Values.sqlRo.enabled }}
{{- $annotations := .Values.sqlRo.service.annotations | default dict }}
{{- if .Values.sqlRo.hostname }}
{{- $annotations = merge (dict "external-dns.alpha.kubernetes.io/hostname" .Values.sqlRo.hostname) $annotations }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-sql-ro" .Release.Name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "centrifuge-api-v4-database.labels" . | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.sqlRo.service.type }}
  {{- with .Values.sqlRo.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    cnpg.io/poolerName: {{ include "centrifuge-api-v4-database.sqlRoPoolerName" . }}
  ports:
    - name: postgres
      port: {{ .Values.sqlRo.service.port }}
      targetPort: pgbouncer
      protocol: TCP
{{- end }}
