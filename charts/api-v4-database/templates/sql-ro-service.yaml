{{- if and (eq .Values.kind "public") .Values.sqlRo.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-sql-ro
  labels:
    {{- include "centrifuge-api-v4-database.labels" . | nindent 4 }}
  {{- with .Values.sqlRo.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.sqlRo.service.type }}
  selector:
    cnpg.io/poolerName: {{ printf "%s-pooler-%s" (include "centrifuge-api-v4-database.cnpgClusterFullname" .) .Values.sqlRo.pooler.name }}
  ports:
    - name: postgres
      port: {{ .Values.sqlRo.service.port }}
      targetPort: pgbouncer
{{- end }}
