{{- if .Values.sqlRo.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: {{ include "centrifuge-api-v4-database.sqlRoPoolerName" . }}
  labels:
    {{- include "centrifuge-api-v4-database.labels" . | nindent 4 }}
spec:
  cluster:
    name: {{ include "centrifuge-api-v4-database.clusterName" . }}
  instances: {{ .Values.sqlRo.pooler.instances }}
  type: {{ .Values.sqlRo.pooler.type }}
  pgbouncer:
    poolMode: {{ .Values.sqlRo.pooler.poolMode }}
    parameters:
      {{- toYaml .Values.sqlRo.pooler.parameters | nindent 6 }}
    pg_hba:
      {{- toYaml .Values.sqlRo.pooler.pg_hba | nindent 6 }}
{{- end }}
