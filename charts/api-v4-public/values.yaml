nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

global:
  # Matches the routes chart environment so route Services can select these pods.
  environment: ""
  env:
    CFG_NETWORK: "mainnet"
    NODE_ENV: "production"
    PUBLIC_API_PORT: "5000"
    HANDLERS_HEALTH_PORT: "3001"
    PUBLIC_API_HEALTH_TIMEOUT_MS: "300000"   # migrations can take a while on first boot
    PUBLIC_API_HEALTH_RETRY_MS: "2000"
    REDPANDA_BROKERS: "cfg-api-redpanda:9093"
  sqlRoHostname: ""
  # dbSecretName: ""               # optional override; default <release>-postgres-app

query:
  enabled: true
  replicaCount: 1                  # runs DB migrations at boot; keep 1
  readOnly: false
  # Route Services select api-v4.centrifuge.io/query-id and tier. Leave empty
  # until this release is a Query the routes chart points at.
  id: ""
  tier: ""
  image:
    repository: ghcr.io/centrifuge/public-api
    pullPolicy: Always
    tag: "latest"
  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  service:
    type: ClusterIP
    port: 5000
  ingress:
    enabled: false
    className: "traefik"
    annotations:
      kubernetes.io/tls-acme: "true"
      traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts: []
    tls: []
    # Empty uses this release's query Service. Promotion sets the idle slot's query Service.
    backendService: ""
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: "1", memory: 512Mi }
  startupProbe:
    httpGet: { path: /health, port: 5000 }
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 60           # covers migration time
  readinessProbe:
    httpGet: { path: /health, port: 5000 }
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  livenessProbe:
    httpGet: { path: /health, port: 5000 }
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  env: []
  envFrom: []
  volumes: []
  volumeMounts: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

handlers:
  enabled: true
  replicaCount: 1                  # consumer group = REDPANDA_CLIENT_ID; never scale up
  failClosed: false
  image:
    repository: ghcr.io/centrifuge/chain-event-handlers
    pullPolicy: Always
    tag: "latest"
  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  service:
    type: ClusterIP
    port: 3001
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { cpu: "1", memory: 2Gi }
  # /health is 200 from process start. /ready stays 503 until replay finishes
  # and the live consumer is running. Liveness stays on /health. The Deployment
  # progress deadline is 1h. replicaCount may be 0 until the indexer is ready.
  startupProbe:
    httpGet: { path: /health, port: 3001 }
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 90
  readinessProbe:
    httpGet: { path: /ready, port: 3001 }
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  livenessProbe:
    httpGet: { path: /health, port: 3001 }
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  env: []
  envFrom: []
  volumes: []
  volumeMounts: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Explicit projection schema. When set, PUBLIC_SCHEMA uses this instead of the
# handlers image tag. Format: pj_YYYYMMDD_NN.
projection:
  schema: ""

# Tag the public views read. Set on the release that owns the database.
# Staging leaves this empty and sets postgres.enabled false.
publicViews:
  schema: ""

postgres:
  enabled: false
  cluster:
    instances: 1
    storage:
      size: 64Gi
      storageClass: "ceph-perf3"
    # Separate WAL PVC. Once enabled on a live Cluster, CNPG rejects disabling it.
    walStorage:
      enabled: true
      size: 32Gi
      storageClass: "ceph-perf3"
    resources:
      requests: { cpu: 250m, memory: 2Gi }
      limits: { cpu: "2", memory: 2Gi }
    affinity:
      topologyKey: topology.cinder.csi.openstack.org/zone
    roles:
      # Defaults for releases that do not expose sql-ro. main.yaml and test.yaml
      # redeclare this list and set passwordSecret to <cluster>-public-ro.
      # Helm replaces the list, so those copies have to stay in step with this
      # one. A live patch of passwordSecret is wiped on the next sync.
      - name: public_ro
        ensure: present
        login: true
        inherit: true
        connectionLimit: 8
        comment: Internet SQL reader. SELECT + LISTEN only.

# Internet SQL reader (SELECT + LISTEN). Off by default.
# Set global.sqlRoHostname in env to enable pooler, LB, and NetworkPolicy.
# Service targetPort must be pgbouncer (CNPG pooler port name), not postgres.
# TLS: upstream CNPG subchart needs postgres.cluster.certificates.serverAltDNSNames;
# use a YAML anchor in the values file so the hostname is defined once.
sqlRo:
  annotations: {}
  service:
    type: LoadBalancer
    port: 5432
  pooler:
    name: sql-ro
    type: rw
    poolMode: session
    instances: 1
    parameters:
      max_client_conn: "16"
      default_pool_size: "8"
      ignore_startup_parameters: extra_float_digits
      server_idle_timeout: "0"
      client_idle_timeout: "0"
      server_lifetime: "0"
    pg_hba:
      - hostssl app public_ro 0.0.0.0/0 scram-sha-256
      - host all all 0.0.0.0/0 reject
