{{- if .Values.postgres.enabled }}
{{- $schema := include "centrifuge-api-v4-public.publicSchema" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "centrifuge-api-v4-public.fullname" . }}-public-views
  labels:
    {{- include "centrifuge-api-v4-public.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "5"
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        {{- include "centrifuge-api-v4-public.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with (.Values.handlers.imagePullSecrets | default .Values.imagePullSecrets) }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: public-views
          image: "{{ .Values.handlers.image.repository }}:{{ .Values.handlers.image.tag | default "latest" }}"
          imagePullPolicy: {{ .Values.handlers.image.pullPolicy }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "centrifuge-api-v4-public.dbSecretName" . }}
                  key: uri
          command:
            - node
            - dist/activation/sync-public-views-cli.js
            - --schema={{ $schema }}
{{- end }}
