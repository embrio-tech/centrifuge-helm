{{- if .Values.handlers.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "centrifuge-api-v4-public.handlers.fullname" . }}
  labels:
    {{- include "centrifuge-api-v4-public.handlers.labels" . | nindent 4 }}
spec:
  type: {{ .Values.handlers.service.type }}
  ports:
    - port: {{ .Values.handlers.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "centrifuge-api-v4-public.handlers.selectorLabels" . | nindent 4 }}
{{- end }}
