nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

global:
  env:
    CFG_NETWORK: "mainnet"
    SELECTED_NETWORKS: "1,8453"
    SELECTED_REGISTRY_VERSIONS: "3_1"
    REDPANDA_BROKERS: "redpanda:9093"
    REDPANDA_SCHEMA_REGISTRY_URL: "http://redpanda:8081"
    LOG_LEVEL: "info"
    ENVIO_HASURA: "false"
    ENVIO_TUI: "false"
    ENVIO_HEALTH_PORT: "8080"
  # -- CNPG app Secret sourcing DB credentials (host/port/username/password/dbname).
  # Default name: <release>-postgres-app (created by the cluster subchart).
  # dbSecretName: ""
  # -- Pre-deployed Secret with ENVIO_RPC_URL_<chainId> keys (and optional ENVIO_API_TOKEN).
  # Default name: <release>-secrets.
  apiSecretName: ""

indexer:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/centrifuge/event-lake
    pullPolicy: IfNotPresent
    tag: "latest"
  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 500m
      memory: 4Gi
    limits:
      cpu: "2"
      memory: 4Gi
  # /health returns 200 as soon as the entrypoint runs (before indexing catches up).
  startupProbe:
    httpGet: { path: /health, port: 8080 }
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 60
  readinessProbe:
    httpGet: { path: /health, port: 8080 }
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  livenessProbe:
    httpGet: { path: /health, port: 8080 }
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  volumes: []
  volumeMounts: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  env: []
  envFrom: []

postgres:
  enabled: false
  cluster:
    instances: 1
    initdb:
      database: envio
    storage:
      size: 64Gi
      storageClass: "ceph-perf3"
    resources:
      requests: { cpu: 500m, memory: 4Gi }
      limits: { cpu: "2", memory: 4Gi }
    affinity:
      topologyKey: topology.cinder.csi.openstack.org/zone
