# Identity. All required; the GitOps ApplicationSet maps them from the Query object.
environment: ""
network: ""
id: ""
projectionId: ""
schema: ""
# Pre-deployed Secret for the read-only query role (keys: uri). Never the owner
# app Secret: read-only is enforced by the database role, not by this chart.
databaseSecretName: ""

image:
  repository: ghcr.io/centrifuge/public-api
  digest: ""
  # Informational only; becomes the app.kubernetes.io/version label.
  displayTag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
replicaCount: 1
# The Query Deployment does not start until the referenced Projection answers
# /health. Replay continues after that; public-api waits for the Projection
# schema before it serves, so the preview is served before replay finishes.
projectionHealthGate:
  enabled: true
  activeDeadlineSeconds: 21600
  pollIntervalSeconds: 5
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 100m, memory: 128Mi }
deploymentReport:
  enabled: false
  githubDeploymentsSecretName: ""
  reporterImage:
    repository: docker.io/library/node
    digest: sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392
  transition: staging-ready
  task: api-v4:staging-ready
  component: query
  sourceCommit: ""
  chart:
    name: ""
    version: ""
    digest: ""
  argoExternalUrl: ""
terminationGracePeriodSeconds: 30
tmpSizeLimit: 64Mi

service:
  type: ClusterIP
  port: 5000

podSecurityContext:
  runAsNonRoot: true
  # The image runs as the non-numeric user "node"; the kubelet needs the UID to
  # verify runAsNonRoot.
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

resources:
  requests: { cpu: 100m, memory: 512Mi }
  limits: { cpu: "1", memory: 512Mi }

startupProbe:
  httpGet: { path: /ready, port: http }
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30
readinessProbe:
  httpGet: { path: /ready, port: http }
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
livenessProbe:
  httpGet: { path: /health, port: http }
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

env: []
envFrom: []
podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

# When the management-cluster ApplicationSet has not passed preview yet, the chart
# still renders preview Ingress from environment id. Keep in sync with api-v4-gitops
# environments/*/config.yaml hosts.direct and hosts.directTlsSecretName.
directPreviewByEnvironment:
  test-eu:
    host: cfg.embrio.tech
    tlsSecretName: cfg-api-v4-preview-tls
  main-eu:
    host: cfg.embrio.tech
    tlsSecretName: cfg-api-v4-preview-tls
  test-us:
    host: cfg-us.embrio.tech
    tlsSecretName: cfg-api-v4-preview-us-tls
  main-us:
    host: cfg-us.embrio.tech
    tlsSecretName: cfg-api-v4-preview-us-tls

global:
  env:
    NODE_ENV: production
    PUBLIC_API_PORT: "5000"
