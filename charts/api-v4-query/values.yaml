# Identity. All required; the GitOps ApplicationSet maps them from the Query object.
environment: ""
network: ""
id: ""
projectionId: ""
schema: ""
# Pre-deployed Secret for the read-only query role (keys: uri). Never the owner
# app Secret: read-only is enforced by the database role, not by this chart.
databaseSecretName: ""

image:
  repository: ghcr.io/centrifuge/public-api
  digest: ""
  # Informational only; becomes the app.kubernetes.io/version label.
  displayTag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
replicaCount: 1
deploymentReport:
  enabled: false
  githubDeploymentsSecretName: ""
  reporterImage:
    repository: docker.io/library/node
    digest: sha256:8cdc1415e1d0b3639da00d2ab90164262cb069ac9e6f84e0bbdb34d456f9e581
  transition: staging-ready
  task: api-v4:staging-ready
  component: query
  sourceCommit: ""
  chart:
    name: ""
    version: ""
    digest: ""
  argoExternalUrl: ""
terminationGracePeriodSeconds: 30
tmpSizeLimit: 64Mi

service:
  type: ClusterIP
  port: 5000

podSecurityContext:
  runAsNonRoot: true
  # The image runs as the non-numeric user "node"; the kubelet needs the UID to
  # verify runAsNonRoot.
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

resources:
  requests: { cpu: 100m, memory: 512Mi }
  limits: { cpu: "1", memory: 512Mi }

startupProbe:
  httpGet: { path: /health, port: http }
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30
readinessProbe:
  httpGet: { path: /health, port: http }
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
livenessProbe:
  httpGet: { path: /health, port: http }
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

env: []
envFrom: []
podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

global:
  env:
    NODE_ENV: production
    PUBLIC_API_PORT: "5000"
