{{- if .Values.projectionHealthGate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "centrifuge-api-v4-query.fullname" . }}-wait-projection
  labels:
    {{- include "centrifuge-api-v4-query.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.projectionHealthGate.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "centrifuge-api-v4-query.hookPodLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: projection-health
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "-e"]
          args:
            - |
              // Projection /health turns 200 once the handlers process is up,
              // before Kafka replay finishes. public-api then waits for the
              // Projection schema before it serves, so waiting on health (not
              // /ready) serves the preview as soon as the schema exists instead
              // of after a full replay.
              const url = process.env.PROJECTION_HEALTH_URL;
              const interval = Number(process.env.POLL_INTERVAL_SECONDS) * 1000;
              const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
              async function main() {
                for (;;) {
                  try {
                    const response = await fetch(url, { signal: AbortSignal.timeout(5000) });
                    if (response.ok) {
                      console.log(`Projection is healthy at ${url}`);
                      return;
                    }
                    console.log(`Projection health returned ${response.status}`);
                  } catch (error) {
                    console.log(`Projection health request failed: ${error.message}`);
                  }
                  await wait(interval);
                }
              }
              main().catch((error) => {
                console.error(error);
                process.exit(1);
              });
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.projectionHealthGate.resources | nindent 12 }}
          env:
            - name: PROJECTION_HEALTH_URL
              value: {{ printf "http://cfg-api-v4-%s-%s:3001/health" .Values.environment .Values.projectionId | quote }}
            - name: POLL_INTERVAL_SECONDS
              value: {{ .Values.projectionHealthGate.pollIntervalSeconds | quote }}
{{- end }}
