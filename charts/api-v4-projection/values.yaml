# Identity. All required; the GitOps ApplicationSet maps them from the Projection object.
environment: ""
network: ""
id: ""
producerId: ""
schema: ""
generation: ""
# @centrifuge/protocol-events version this Projection's image carries, from the
# Projection object's protocolEvents.packageVersion. When set, the handler rejects a
# Producer discovery snapshot built against a different package version.
protocolEventsVersion: ""
# Environment-owned public database app Secret (keys: uri). Owner role: this
# Projection migrates and writes its own schema.
databaseSecretName: ""

image:
  repository: ghcr.io/centrifuge/chain-event-handlers
  digest: ""
  # Informational only; becomes the app.kubernetes.io/version label.
  displayTag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
replicaCount: 1
# Kafka replay before /ready can exceed one hour on a full resync.
progressDeadlineSeconds: 21600
# The Projection starts once the Producer answers /health, so handlers replay
# while origination catches up and the preview is served sooner.
producerHealthGate:
  enabled: true
  # Not shorter than the Producer rollout deadline (indexer progressDeadlineSeconds),
  # so the gate cannot fail while the Producer is still progressing.
  activeDeadlineSeconds: 43200
  pollIntervalSeconds: 5
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 100m, memory: 128Mi }
# Only rendered for the staging gate object (deploymentReport.enabled). Holds the
# staging-ready success until the Producer answers /ready, because a Projection
# that started on Producer /health can be ready while origination still catches
# up, which would expose an incomplete staging Query.
producerReadyReportGate:
  enabled: true
  # Not shorter than the Producer rollout deadline (indexer progressDeadlineSeconds).
  activeDeadlineSeconds: 43200
  pollIntervalSeconds: 5
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 100m, memory: 128Mi }
deploymentReport:
  enabled: false
  githubDeploymentsSecretName: ""
  reporterImage:
    repository: docker.io/library/node
    digest: sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392
  transition: staging-ready
  task: api-v4:staging-ready
  component: projection
  sourceCommit: ""
  chart:
    name: ""
    version: ""
    digest: ""
  argoExternalUrl: ""
# Greenfield Projections stop on any unapproved skip instead of advancing the offset.
failClosed: true
terminationGracePeriodSeconds: 60
# public-db writes rewritten migration files under the OS temp dir.
tmpSizeLimit: 256Mi

service:
  type: ClusterIP
  port: 3001

podSecurityContext:
  runAsNonRoot: true
  # The image runs as the non-numeric user "node"; the kubelet needs the UID to
  # verify runAsNonRoot.
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

resources:
  requests: { cpu: 250m, memory: 1Gi }
  limits: { cpu: "1", memory: 2Gi }

startupProbe:
  httpGet: { path: /health, port: http }
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 90
readinessProbe:
  httpGet: { path: /ready, port: http }
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
livenessProbe:
  httpGet: { path: /health, port: http }
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

env: []
envFrom: []
podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

global:
  env:
    NODE_ENV: production
    HANDLERS_HEALTH_PORT: "3001"
    # Empty sends handler logs to stdout. The default file under /app fails on the
    # read-only root filesystem and the process exits before logging why.
    HANDLERS_LOG_FILE: ""
    REDPANDA_BROKERS: cfg-api-redpanda:9093
