{{- if .Values.stagingAdopt.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "centrifuge-api-v4-projection.fullname" . }}-staging-adopt
  labels:
    {{- include "centrifuge-api-v4-projection.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        {{- include "centrifuge-api-v4-projection.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dispatch
          image: "{{ .Values.stagingAdopt.curlImage.repository }}@{{ .Values.stagingAdopt.curlImage.digest }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
          volumeMounts:
            - name: curl-auth
              mountPath: /etc/curl
              readOnly: true
          command:
            - /bin/sh
            - -ec
            - |
              set -eu
              for attempt in 1 2 3 4 5; do
                if curl --config /etc/curl/auth.conf -fsS \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  -d '{"event_type":"staging-adopt","client_payload":{"environment":{{ .Values.environment | quote }},"component":"projection","producerId":{{ .Values.producerId | quote }},"projectionId":{{ .Values.id | quote }}}}' \
                  https://api.github.com/repos/centrifuge/api-v4-gitops/dispatches; then
                  exit 0
                fi
                sleep 5
              done
              exit 1
      volumes:
        - name: curl-auth
          secret:
            secretName: {{ .Values.stagingAdopt.dispatchSecretName | quote }}
            items:
              - key: auth.conf
                path: auth.conf
{{- end }}
