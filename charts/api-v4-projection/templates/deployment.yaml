{{- include "centrifuge-api-v4-projection.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "centrifuge-api-v4-projection.fullname" . }}
  labels:
    {{- include "centrifuge-api-v4-projection.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  # Every start replays Kafka from the beginning before /ready turns 200.
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "centrifuge-api-v4-projection.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "centrifuge-api-v4-projection.podLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: handlers
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: POSTGRAPHILE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecretName | quote }}
                  key: uri
            - name: REDPANDA_CLIENT_ID
              value: {{ printf "handlers-%s-%s-%s" .Values.environment .Values.generation .Values.id | quote }}
            - name: PUBLIC_SCHEMA
              value: {{ .Values.schema | quote }}
            - name: INDEX_GENERATION
              value: {{ .Values.generation | quote }}
            - name: PROJECTION_ID
              value: {{ .Values.id | quote }}
            - name: CFG_NETWORK
              value: {{ .Values.network | quote }}
            - name: HANDLERS_FAIL_CLOSED
              value: {{ .Values.failClosed | toString | quote }}
            - name: PRODUCER_DISCOVERY_URL
              value: {{ printf "http://cfg-api-v4-%s-%s-indexer:8080/discovery" .Values.environment .Values.producerId | quote }}
            {{- if .Values.protocolEventsVersion }}
            - name: PROTOCOL_EVENTS_VERSION
              value: {{ .Values.protocolEventsVersion | quote }}
            {{- end }}
            {{- range $key, $value := .Values.global.env }}
            - name: {{ $key }}
              value: {{ $value | toString | quote }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpSizeLimit }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
