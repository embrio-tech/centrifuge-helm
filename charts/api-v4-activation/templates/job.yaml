{{- if .Values.operation.operationId }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "centrifuge-api-v4-activation.jobName" . }}
  labels:
    {{- include "centrifuge-api-v4-activation.labels" . | nindent 4 }}
    api-v4.centrifuge.io/operation-id: {{ .Values.operation.operationId | quote }}
  annotations:
    # A Sync hook is not part of the desired state, so Argo CD never reports the
    # Job as missing or recreates it on its own. A repeated sync re-runs it; the
    # completed receipt for operationId in cfg_release turns that into a no-op.
    # Wave -1 is after the report ConfigMap (wave -2) and before route resources
    # (wave 0). A failed hook stops the sync, so those resources stay as they were.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "centrifuge-api-v4-activation.selectorLabels" . | nindent 8 }}
        api-v4.centrifuge.io/operation-id: {{ .Values.operation.operationId | quote }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: activator
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - node
            - dist/activation/cli.js
            - {{ .Values.operation.command | quote }}
            - --environment={{ .Values.environment }}
            - --fence={{ .Values.operation.fence }}
            - --expected-old-projection={{ .Values.operation.expectedOldProjection }}
            - --desired-projection={{ .Values.operation.desiredProjection }}
            - --operation-id={{ .Values.operation.operationId }}
          env:
            # Read from the environment, never argv, so the password stays out of
            # the process list and the Pod spec.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.activatorSecretName | quote }}
                  key: uri
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
