{{- if and .Values.deploymentReport.enabled .Values.operation.operationId }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "centrifuge-api-v4-activation.jobName" . }}-deployment-report
  labels:
    {{- include "centrifuge-api-v4-activation.labels" . | nindent 4 }}
  annotations:
    # Normal resource, earlier than the success Job. A Sync hook in this wave
    # would start before the ConfigMap exists.
    argocd.argoproj.io/sync-wave: "-2"
data:
  github-transition-report.mjs: |
{{- .Files.Get "files/github-transition-report.mjs" | nindent 4 }}
  github-transition-report-lib.mjs: |
{{- .Files.Get "files/github-transition-report-lib.mjs" | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "centrifuge-api-v4-activation.jobName" . }}-report-success
  labels:
    {{- include "centrifuge-api-v4-activation.labels" . | nindent 4 }}
  annotations:
    # Wave 0 hook runs after the activation Job and before route resources.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "centrifuge-api-v4-activation.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: report
          image: "{{ .Values.deploymentReport.reporterImage.repository }}@{{ .Values.deploymentReport.reporterImage.digest }}"
          imagePullPolicy: IfNotPresent
          workingDir: /opt/report
          command: ["node", "github-transition-report.mjs"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          env:
            {{- include "centrifuge-api-v4-activation.deploymentReportEnv" (dict "root" . "state" "success") | nindent 12 }}
          volumeMounts:
            - name: report-scripts
              mountPath: /opt/report
              readOnly: true
            - name: github-key
              mountPath: /etc/github
              readOnly: true
      volumes:
        - name: report-scripts
          configMap:
            name: {{ include "centrifuge-api-v4-activation.jobName" . }}-deployment-report
        - name: github-key
          secret:
            secretName: {{ .Values.deploymentReport.githubDeploymentsSecretName | quote }}
            items:
              - key: private-key.pem
                path: private-key.pem
{{- end }}
