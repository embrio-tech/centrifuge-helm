environment: ""
# Pre-deployed Secret for the activator role (keys: uri).
activatorSecretName: ""

# One fenced operation. Nothing renders while operationId is empty. In GitOps
# this block comes from environments/<env>/activation.yaml.
operation:
  # activate | compensate
  command: activate
  # Lowercase DNS label; becomes part of the Job name. New for every operation:
  # a rerun with the same id and request is a no-op.
  operationId: ""
  # cfg_release.active_state.fence before this operation; "0" before the first.
  fence: ""
  # Projection IDs (pj-YYYYMMDD-NN). expectedOldProjection is "none" for the
  # first activation of an Environment.
  expectedOldProjection: ""
  desiredProjection: ""

# Handlers image of the desired Projection: its public-db schema defines the
# public views being activated.
image:
  repository: ghcr.io/centrifuge/chain-event-handlers
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
activeDeadlineSeconds: 300

podSecurityContext:
  runAsNonRoot: true
  # The image runs as the non-numeric user "node"; the kubelet needs the UID to
  # verify runAsNonRoot.
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: 200m, memory: 256Mi }
