{{- range $role := list "staging" "production" "rollback" }}
{{- $query := index $.Values (printf "%sQuery" $role) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-%s" $.Release.Name $role }}
  labels:
    {{- include "centrifuge-api-v4-routes.labels" $ | nindent 4 }}
    api-v4.centrifuge.io/role: {{ $role | quote }}
spec:
  type: ClusterIP
  # Query Pods are selected by object labels only, never by Helm or Argo CD
  # tracking labels, so a route moves by changing the Query ID here.
  selector:
    api-v4.centrifuge.io/environment: {{ $.Values.environment | quote }}
    api-v4.centrifuge.io/component: query
    api-v4.centrifuge.io/query-id: {{ $query | quote }}
  ports:
    - name: http
      port: {{ $.Values.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
