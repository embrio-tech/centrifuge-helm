{{- $routes := list
  (dict "role" "staging" "query" .Values.stagingQuery)
  (dict "role" "production" "query" .Values.productionQuery)
  (dict "role" "rollback" "query" .Values.rollbackQuery)
}}
{{- range $routes }}
{{- if not (regexMatch "^q-[0-9]{8}-[0-9]{2}$" .query) }}
{{- fail (printf "%s query must be a Query ID" .role) }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ .role }}
  labels:
    api-v4.centrifuge.io/component: routes
    api-v4.centrifuge.io/environment: {{ $.Values.environment | quote }}
    api-v4.centrifuge.io/role: {{ .role | quote }}
spec:
  selector:
    api-v4.centrifuge.io/environment: {{ $.Values.environment | quote }}
    api-v4.centrifuge.io/component: query
    api-v4.centrifuge.io/query-id: {{ .query | quote }}
  ports:
    - name: http
      port: {{ $.Values.service.port }}
      targetPort: http
{{- end }}
