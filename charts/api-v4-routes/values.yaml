# Required. No defaults: a route must never point at a Query by accident.
# GitOps passes environments/<env>/routes.yaml as this chart's values file, so the
# keys match that file.
environment: ""
stagingQuery: ""
productionQuery: ""
rollbackQuery: ""

deploymentReport:
  enabled: false
  githubDeploymentsSecretName: ""
  reporterImage:
    repository: docker.io/library/node
    digest: sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392
  transition: routes
  task: api-v4:routes
  component: routes
  chart:
    name: centrifuge-api-v4-routes
    version: ""
    digest: ""
  argoExternalUrl: ""
  environmentUrl: ""

service:
  port: 5000

# Traefik Ingress and edge CORS/CSP for public hostnames. Hostnames and TLS secret
# names are set per Environment from GitOps; both roles start disabled until cutover.
ingress:
  className: traefik
  annotations:
    kubernetes.io/tls-acme: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  staging:
    enabled: false
    host: ""
    tlsSecretName: ""
  production:
    enabled: false
    host: ""
    tlsSecretName: ""
  cors:
    maxAgeSeconds: 86400
    allowMethods:
      - GET
      - POST
      - OPTIONS
    allowHeaders:
      - Content-Type
      - Accept
    allowOriginList:
      - http://localhost:3000
      - http://localhost:3003
    allowOriginListRegex:
      - ^https://([a-z0-9-]+\.)*centrifuge\.io$
      - ^https://([a-z0-9-]+\.)*centrifugelabs\.io$
      - ^https://([a-z0-9-]+\.)*centrifugescan\.io$
      - ^https://([a-z0-9-]+\.)*centrifuge-kf\.workers\.dev$
  csp:
    graphql: "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    # Ruru ships inline <style> (body margin / full viewport) and module Workers under /ruru-static/.
    ruru: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
