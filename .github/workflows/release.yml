name: Release Charts

# Publishes Helm charts under charts/ to GitHub Pages.
# Triggers on chart changes, release-infra changes (workflow/scripts), or manual dispatch.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      charts:
        description: "Charts to release (comma-separated, empty = all)"
        required: false
        default: ""
      bump_version:
        description: "Bump patch version before release"
        type: boolean
        default: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release]')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed chart directories
        id: changed-files
        if: github.event_name == 'push'
        uses: tj-actions/changed-files@v45
        with:
          files: |
            charts/**
            .github/workflows/release.yml
            scripts/fetch-chart-dependencies.sh
          dir_names: true
          dir_names_max_depth: 2
          json: false

      - name: Build chart release list
        id: changed
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            requested='${{ inputs.charts }}'
            if [ -n "$requested" ]; then
              CHARTS="$(echo "$requested" | tr ',' ' ' | xargs)"
            else
              CHARTS="$(find charts -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort | tr '\n' ' ' | xargs)"
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "charts=$CHARTS" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.bump_version }}" = "true" ]; then
              echo "bump=true" >> "$GITHUB_OUTPUT"
            else
              echo "bump=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          CHANGED_DIRS='${{ steps.changed-files.outputs.all_changed_files }}'
          if [ -z "$CHANGED_DIRS" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          INFRA_CHANGED=false
          for path in $CHANGED_DIRS; do
            case "$path" in
              .github/workflows/release.yml|scripts/fetch-chart-dependencies.sh)
                INFRA_CHANGED=true
                ;;
            esac
          done

          CHART_DIRS="$(printf '%s\n' $CHANGED_DIRS | tr ' ' '\n' | awk -F/ 'NF>=2 && $1=="charts" {print $2}' | sort -u | tr '\n' ' ' | xargs)"

          if [ "$INFRA_CHANGED" = true ] && [ -z "$CHART_DIRS" ]; then
            CHART_DIRS="$(find charts -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort | tr '\n' ' ' | xargs)"
            echo "bump=false" >> "$GITHUB_OUTPUT"
          else
            echo "bump=true" >> "$GITHUB_OUTPUT"
          fi

          if [ -z "$CHART_DIRS" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "charts=$CHART_DIRS" >> "$GITHUB_OUTPUT"

      - name: Bump chart versions
        if: steps.changed.outputs.changed == 'true' && steps.changed.outputs.bump == 'true'
        run: |
          set -euo pipefail
          for chart in ${{ steps.changed.outputs.charts }}; do
            CHART_FILE="charts/$chart/Chart.yaml"
            version="$(yq e '.version' "$CHART_FILE")"
            IFS='.' read -r major minor patch <<<"$version"
            new_version="${major}.${minor}.$((patch + 1))"
            yq e -i ".version = \"${new_version}\"" "$CHART_FILE"
            echo "$CHART_FILE: version: $version -> version: $new_version"
          done

      - name: Fetch chart dependencies
        if: steps.changed.outputs.changed == 'true'
        run: ./scripts/fetch-chart-dependencies.sh

      - name: Package charts
        if: steps.changed.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p .cr-release-packages
          for chart in charts/*/; do
            [ -f "${chart}Chart.yaml" ] || continue
            helm package "$chart" --dependency-update=false --destination .cr-release-packages
          done

      - name: Configure git identity for chart-releaser
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      # chart-releaser-action skip_packaging crashes (latest_tag unbound).
      # Package with helm above, then upload/index with cr directly.
      - name: Upload charts and update index
        if: steps.changed.outputs.changed == 'true'
        run: |
          set -euo pipefail
          version=v1.7.0
          curl -sSLo cr.tar.gz "https://github.com/helm/chart-releaser/releases/download/${version}/chart-releaser_${version#v}_linux_amd64.tar.gz"
          tar -xzf cr.tar.gz cr
          owner="${GITHUB_REPOSITORY%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          rm -rf .cr-index
          mkdir -p .cr-index
          ./cr upload -o "$owner" -r "$repo" -c "$(git rev-parse HEAD)" --skip-existing
          ./cr index -o "$owner" -r "$repo" --push
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Commit version bumps
        if: steps.changed.outputs.changed == 'true' && steps.changed.outputs.bump == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: bump chart versions [skip release]"
          file_pattern: "charts/*/Chart.yaml"
          commit_user_name: "${{ github.actor }}"
          commit_user_email: "${{ github.actor }}@users.noreply.github.com"
