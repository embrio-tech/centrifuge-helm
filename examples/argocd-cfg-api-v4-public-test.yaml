# Argo CD Application: public-api (PostGraphile) + chain-event-handlers for testnet (eu main cluster).
# Namespace: cfg-api. Sync wave 1 (after Redpanda).
# Helm values live in centrifuge/backend environments/test.yaml.
# query runs Drizzle migrations at boot; handlers wait for PUBLIC_API_HEALTH_URL then replay Kafka.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cfg-api-v4-public-test
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: cfg-api
  sources:
    - repoURL: https://embrio-tech.github.io/centrifuge-helm
      targetRevision: "0.1.10"
      chart: centrifuge-api-v4-public
      helm:
        releaseName: cfg-api-v4-public-test
        valueFiles:
          - $values/environments/test.yaml
        # Cutover to routes Ingress: merge this block on the live Application only.
        # Do not set query.ingress.enabled in centrifuge/backend environments/test.yaml.
        # values: |
        #   query:
        #     ingress:
        #       enabled: false
    - repoURL: git@github.com:centrifuge/backend.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cfg-api
