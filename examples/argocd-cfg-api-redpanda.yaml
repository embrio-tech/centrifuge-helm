# Argo CD Application: Redpanda cluster for the event-lake / public-api stack (eu main cluster).
# Namespace: cfg-api. Shared by mainnet and testnet (topics are network-prefixed).
# Sync wave 0: Kafka must be up before event-lake (wave 1) creates its topics.
# Kafka/Schema Registry stay in-cluster (external NodePort is off in chart defaults).
# Console has no auth, so it must not be exposed to the public internet: keep the
# Ingress off and reach it with
# `kubectl -n cfg-api port-forward svc/cfg-api-redpanda-console 8080:8080`.
# This release does not take indexer generation ids. Event-lake creates topics.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cfg-api-redpanda
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: cfg-api
  source:
    repoURL: https://embrio-tech.github.io/centrifuge-helm
    targetRevision: "0.1.9"
    chart: redpanda
    helm:
      releaseName: cfg-api-redpanda
      values: |
        redpanda:
          storage:
            persistentVolume:
              storageClass: ceph-perf3
          console:
            enabled: true
            # No ingress: Console has no auth and must not be reachable from the
            # public internet. Access is in-cluster only (port-forward), see the
            # header comment.
            ingress:
              enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: cfg-api
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
