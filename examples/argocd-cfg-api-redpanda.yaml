# Argo CD Application: Redpanda cluster for the event-lake / public-api stack (eu main cluster).
# Namespace: cfg-api. Shared by mainnet and testnet (topics are network-prefixed).
# Sync wave 0: Kafka must be up before event-lake (wave 1) creates its topics.
# Kafka/Schema Registry stay in-cluster (external NodePort is off in chart defaults).
# Console ingress has no auth; treat the host as operator-only.
# This release does not take indexer generation ids. Event-lake creates topics.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cfg-api-redpanda
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: cfg-api
  source:
    repoURL: https://embrio-tech.github.io/centrifuge-helm
    targetRevision: "0.1.9"
    chart: redpanda
    helm:
      releaseName: cfg-api-redpanda
      values: |
        redpanda:
          storage:
            persistentVolume:
              storageClass: ceph-perf3
          console:
            enabled: true
            ingress:
              enabled: true
              className: traefik
              annotations:
                kubernetes.io/tls-acme: "true"
                traefik.ingress.kubernetes.io/router.entrypoints: websecure
                nginx.ingress.kubernetes.io/ssl-redirect: "true"
              hosts:
                - host: redpanda.cfg.embrio.tech
                  paths:
                    - path: /
                      pathType: Prefix
              tls:
                - secretName: redpanda-cfg-embrio-tech-tls
                  hosts:
                    - redpanda.cfg.embrio.tech
  destination:
    server: https://kubernetes.default.svc
    namespace: cfg-api
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
