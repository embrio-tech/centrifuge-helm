# Argo CD Application: eRPC 0.5.0 side-by-side instance for the cfg-api stack (us cluster beta). Namespace: cfg-api.
# Reviewed by ops, not applied by CI.
#
# Versioned instance name cfg-api-erpc-us-v0-5. It runs ALONGSIDE the legacy
# cfg-api-erpc-us (0.0.64) until cutover; consumers are repointed one at a time
# and the legacy Application is frozen (see examples/argocd-cfg-api-erpc_us.yaml,
# which is a snapshot of the live spec and must not be edited). Per the naming
# convention releaseName == Application name, so every resource (Service, CNPG
# Cluster <name>-postgres, Redis, PVCs, TLS secret) is isolated from the legacy
# instance: no Service selector overlap, no Redis key overlap, separate PVCs.
# The `_us` filename suffix convention is superseded here because the region is
# in the Application name; the file still follows argocd-<application-name>.yaml.
#
# `erpc.enforceNaming: true` makes the render fail unless the release name
# matches cfg-api-erpc-(eu|us)-v<MAJOR>-<MINOR> and the Postgres cache TTLs are
# set to expire.
#
# Storage: perf3 on us (ceph-perf3 on eu). Chart defaults for data/WAL are NOT
# changed; this instance sets 128Gi data + 32Gi WAL explicitly, sized for the 7d
# cache TTL.
#
# Secrets (pre-deployed by ops, read-only, shared with the legacy instance):
# cfg-api-v3-rpc-keys, cfg-api-v3-erpc-auth-keys.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cfg-api-erpc-us-v0-5
  namespace: argo
spec:
  project: cfg-api
  source:
    repoURL: https://embrio-tech.github.io/centrifuge-helm
    # Chart version published by CI after the eRPC 0.5.0 chart change. The legacy
    # instances stay pinned at 0.1.56 and never see this version.
    targetRevision: 0.1.58
    helm:
      releaseName: cfg-api-erpc-us-v0-5
      values: |
        postgres:
          enabled: true
          cluster:
            instances: 1
            storage:
              size: 64Gi
              storageClass: perf3
            walStorage:
              enabled: true
              size: 32Gi
              storageClass: perf3
        global:
          erpcSecretName: cfg-api-v3-rpc-keys
          erpcAuthSecretName: cfg-api-v3-erpc-auth-keys
        redis:
          enabled: true
          master:
            persistence:
              storageClass: perf3
        erpc:
          replicaCount: 2
          enforceNaming: true
          lineLabel: v0-5
          image:
            tag: "0.5.0"
          database:
            evmJsonRpcCache:
              enabled: true
              postgresql:
                # 7 days, expressed in Go time.ParseDuration syntax (eRPC does
                # not accept "7d"). Rows written by backfills self-prune.
                finalizedTtl: 168h
                unknownTtl: 168h
          ingress:
            enabled: true
            hosts:
              - host: erpc-v0-5.cfg-us.embrio.tech
                paths:
                  - path: /
                    pathType: Prefix
            tls:
              - secretName: cfg-api-erpc-us-v0-5-tls
                hosts:
                  - erpc-v0-5.cfg-us.embrio.tech
          config:
            logLevel: info
            server:
              maxTimeout: 180s
              # Drain in-flight work before exit; the chart's 180s grace covers both waits.
              waitBeforeShutdown: 30s
              waitAfterShutdown: 30s
              # Never echo upstream URLs/keys back to callers in error.data.
              includeErrorDetails: false
              # Accept WebSocket upgrades (eth_subscribe/newHeads, newPendingTransactions,
              # logs) on the HTTP port; consumers can use ws://…:4000. Off in legacy 0.0.64.
              webSocket:
                enabled: true
                # Instance-wide caps (0 = unlimited). Bounds a client opening many
                # connections; per-connection caps keep their defaults.
                maxConnections: 200
                maxConnectionsPerIP: 50
                maxSubscriptions: 5000
              # Only the ingress may set the real client IP. Trusting the pod CIDRs here
              # let any pod spoof X-Forwarded-For past auth.allowedCIDRs.
              trustedIPForwarders:
                - 192.168.42.0/24
              trustedIPHeaders:
                - X-Forwarded-For
                - X-Real-Ip
            rateLimiters:
              budgets:
                # Outbound provider budgets, attached per vendor in the provider
                # overrides below. Generous ceilings; rateLimitAutoTune backs off
                # on 429/error rate and recovers on its own.
                - id: quicknode-global
                  rules:
                    - method: "*"
                      maxCount: 1000
                      period: second
                - id: alchemy-global
                  rules:
                    - method: "*"
                      maxCount: 1000
                      period: second
                - id: drpc-global
                  rules:
                    - method: "*"
                      maxCount: 1000
                      period: second
            projects:
              - id: main
                auth:
                  strategies:
                    - type: network
                      network:
                        # Both pod CIDRs reach eRPC directly (source IP = pod IP);
                        # only the ingress is trusted to rewrite the client IP.
                        allowedCIDRs:
                          - 10.42.0.0/16
                          - 10.43.0.0/16
                        trustedProxies:
                          - 192.168.42.0/24
                # Project-wide data integrity (0.5.0). Applies to every network; a
                # network may override per check. Replaces the deprecated
                # directiveDefaults.validate* / enforceLogIndexStrictIncrements
                # flags (which only warn under 0.5.0 and change semantics).
                # 0.5.0: `level` is the front door (~20 free intrinsic checks);
                # `checks` tunes individual rules above it. Start in observeOnly so
                # violations are measured, not rejected; promote once
                # erpc_integrity_check_total{outcome="would_reject"} is quiet.
                # HyperEVM (999) overrides the root-recompute checks below.
                integrity:
                  level: intrinsic
                  observeOnly: true
                  checks:
                    bloomMatch:
                      enabled: true
                    transactionIndexConsistency:
                      enabled: true
                    logIndexContiguity:
                      enabled: true
                networkDefaults:
                  # Finality-split failsafe (0.5.0). Realtime/unfinalized needs a
                  # NON-ZERO retry delay so shared-state propagation can win the race;
                  # hedging hides a slow provider on the tail. Finalized reads retry
                  # immediately. See docs "networks" worked example #1.
                  failsafe:
                    - matchMethod: "eth_getLogs"
                      matchFinality: [realtime, unfinalized]
                      timeout:
                        duration: 180s
                      hedge:
                        quantile: 0.95
                        maxCount: 1
                        minDelay: 500ms
                        maxDelay: 10s
                      retry:
                        maxAttempts: 4
                        delay: 50ms
                    - matchMethod: "eth_getLogs"
                      matchFinality: [finalized, unknown]
                      timeout:
                        duration: 180s
                      hedge:
                        quantile: 0.95
                        maxCount: 1
                        minDelay: 500ms
                        maxDelay: 10s
                      retry:
                        maxAttempts: 4
                        delay: 0ms
                    - matchMethod: "eth_call"
                      hedge:
                        quantile: 0.95
                        maxCount: 1
                        minDelay: 500ms
                        maxDelay: 10s
                      retry:
                        maxAttempts: 4
                        delay: 0ms
                    - matchMethod: "*"
                      timeout:
                        duration: 30s
                      retry:
                        maxAttempts: 4
                        delay: 50ms
                  evm:
                    getLogsSplitOnError: true
                    getLogsMaxAllowedRange: 10000
                    getLogsSplitConcurrency: 4
                    # Serve "latest" only once a majority of upstreams agree on the
                    # tip, so a client never gets a block only one provider has.
                    servedTip:
                      quorum: majority
                    # Indexers send fromBlock:"0x0" in eth_subscribe logs filters;
                    # strip it so the live stream doesn't fail on pruned nodes.
                    stripSubscribeFromBlockZero: true
                  directiveDefaults:
                    enforceHighestBlock: true
                    enforceGetLogsBlockRange: true
                  # Rotate eth_subscribe across the Alchemy, dRPC and QuickNode WS
                  # twins. The WS upstreams are ignoreMethods:["*"] except
                  # subscribe, so this order only affects subscriptions. The order
                  # advances hourly (one upstream re-subscribe per hour) so
                  # subscription load also rotates. Networks with their own
                  # selectionPolicy (Hyperliquid, Avalanche) keep it.
                  selectionPolicy:
                    evalInterval: 15s
                    evalScope: network
                    evalFunc: |
                      (upstreams, ctx) => {
                        const ranked = upstreams
                          .removeCordoned()
                          .excludeIf(all(samplesAbove(10), errorRateAbove(0.7)))
                          .excludeIf(all(samplesAbove(10), throttleRateAbove(0.4)))
                          .excludeIf(any(all(samplesAbove(20), latencyAbove(3000), latencyDeviationAbove(3, { mode: 'majority' })), latencyAbove(10000)))
                          .excludeIf(any(blockNumberLagAbove(16), blockSecondsLagAbove(30)), { probe: false })
                          .whenEmpty(() => upstreams)
                          .preferTag('!tier:fallback', { minHealthy: 1, fallback: 'tier:fallback' })
                          .sortByScore(PREFER_FASTEST)
                          .probeExcluded({ sampleRate: 0.1, minSamples: 10, minSamplesWindow: '60s', maxConcurrent: 4, timeout: '10s' });
                        // Spread across providers every hour and rotate the primary vendor
                        // hourly, so no chain pins to one vendor. Region offset 1 (US) so it never matches EU's vendor for a chain/hour.
                        // If a provider is excluded (errors/throttle/latency) or only one remains,
                        // both regions fall back to it — an accepted degradation exception.
                        // Non-WS upstreams are grouped by vendor and the vendor order is
                        // advanced by slot, so the two clusters are never on the same
                        // vendor for the same chain in the same hour. WS twins use the same
                        // slot so subscription ingress rotates too.
                        const chain = Number(String(ctx.network || '').replace(/\D/g, '')) || 0;
                        const hour = Math.floor((ctx.now || 0) / 3600000);
                        const baseSlot = chain + hour;
                        const slot = baseSlot + 1; // region applied once, at vendor start
                        const rotated = ranked.rotateBy(baseSlot);
                        const isWs = (u) => typeof u.id === 'string' && u.id.indexOf('ws-') === 0;
                        const vendorOf = (u) => {
                          const id = typeof u.id === 'string' ? u.id : '';
                          if (id.indexOf('quicknode-') === 0 || id.indexOf('hl-quicknode') === 0) return 'quicknode';
                          if (id.indexOf('alchemy-') === 0 || id.indexOf('hl-alchemy') === 0) return 'alchemy';
                          if (id.indexOf('drpc-') === 0) return 'drpc';
                          const ep = typeof u.endpoint === 'string' ? u.endpoint : '';
                          if (ep.indexOf('alchemy') !== -1) return 'alchemy';
                          if (ep.indexOf('quiknode') !== -1 || ep.indexOf('quicknode') !== -1) return 'quicknode';
                          if (ep.indexOf('drpc') !== -1) return 'drpc';
                          return 'other';
                        };
                        const vKeys = [];
                        const vItems = [];
                        for (const u of rotated.filter((x) => !isWs(x))) {
                          const v = vendorOf(u);
                          let idx = vKeys.indexOf(v);
                          if (idx === -1) { vKeys.push(v); vItems.push([]); idx = vKeys.length - 1; }
                          vItems[idx].push(u);
                        }
                        const vStart = vKeys.length ? ((slot % vKeys.length) + vKeys.length) % vKeys.length : 0;
                        const rest = [];
                        for (let i = 0; i < vKeys.length; i++) rest.push(...vItems[(vStart + i) % vKeys.length]);
                        const wsGroups = ['ws-alchemy-', 'ws-drpc-', 'ws-quicknode-']
                          .map((prefix) => rotated.filter((u) => typeof u.id === 'string' && u.id.indexOf(prefix) === 0))
                          .filter((group) => group.length > 0);
                        const wsStart = wsGroups.length ? ((slot % wsGroups.length) + wsGroups.length) % wsGroups.length : 0;
                        const orderedWs = [];
                        for (let i = 0; i < wsGroups.length; i++) orderedWs.push(...wsGroups[(wsStart + i) % wsGroups.length]);
                        return rest.concat(orderedWs);
                      }
                upstreamDefaults:
                  evm:
                    # WS heads are pushed (server.webSocket enabled); 2s polling across
                    # every upstream/chain is avoidable load. Provider default is 10s.
                    statePollerInterval: 10s
                  failsafe:
                    - matchMethod: "eth_getLogs"
                      timeout:
                        duration: 180s
                      retry:
                        maxAttempts: 2
                        delay: 250ms
                        backoffFactor: 2
                      hedge: null
                    - matchMethod: "*"
                      timeout:
                        duration: 30s
                      retry:
                        maxAttempts: 2
                        delay: 250ms
                        backoffFactor: 2
                      hedge: null
                networks:
                  # Monad (143): historical eth_getLogs/eth_call are slow and the vendors
                  # cap the log range, so the explicit upstreams below split eth_getLogs
                  # at 1000 blocks and the network allows a long historical timeout. It
                  # inherits the rotating policy.
                  - architecture: evm
                    evm:
                      chainId: 143
                      # Client hard cap. eRPC rejects a larger eth_getLogs range with
                      # ErrGetLogsExceededMaxAllowedRange (HTTP 413) before any split.
                      # This is not the split trigger: each upstream's
                      # getLogsAutoSplittingRangeThreshold does the split.
                      getLogsMaxAllowedRange: 10000
                      fallbackFinalityDepth: 10
                    failsafe:
                      - matchMethod: "eth_getLogs"
                        timeout:
                          duration: 300s
                        hedge:
                          quantile: 0.95
                          maxCount: 1
                          minDelay: 500ms
                          maxDelay: 10s
                        retry:
                          maxAttempts: 4
                          delay: 50ms
                      - matchMethod: "eth_call"
                        timeout:
                          duration: 120s
                        retry:
                          maxAttempts: 4
                          delay: 0ms
                      - matchMethod: "*"
                        timeout:
                          duration: 30s
                        retry:
                          maxAttempts: 4
                          delay: 50ms
                  - architecture: evm
                    evm:
                      chainId: 999
                      fallbackFinalityDepth: 40
                    directiveDefaults:
                      enforceHighestBlock: true
                      enforceGetLogsBlockRange: true
                      enforceNonNullTaggedBlocks: true
                    # HyperEVM (999) omits system txs from the tx array but keeps them
                    # in transactionsRoot, so the tx-array-derived checks and the two
                    # root recomputations are disabled for this network only.
                    integrity:
                      checks:
                        transactionsRootConsistency:
                          enabled: false
                        transactionsRootRecompute:
                          enabled: false
                        receiptsRootRecompute:
                          enabled: false
                        txBlockInfo:
                          enabled: false
                        txFieldUniqueness:
                          enabled: false
                        bloomMatch:
                          enabled: false
                        transactionIndexConsistency:
                          enabled: false
                        logIndexContiguity:
                          enabled: false
                    selectionPolicy:
                      evalInterval: 15s
                      # 0.5.0: one eval slot per network (ctx.method is "*"),
                      # replacing the legacy evalPerMethod:false / resampleExcluded.
                      evalScope: network
                      evalFunc: |
                        (upstreams, ctx) => {
                          const method = ctx.method;
                          // Rotate the live primary hourly between QuickNode and Alchemy so HYPE
                          // CU is shared. Block/log requests still pin to the single chosen
                          // primary per tick, keeping block + logs on one vendor.
                          const hourSlot = Math.floor(Date.now() / 3600000);
                          const qnFirst = (hourSlot + 1) % 2 === 0;
                          const primaryId = qnFirst ? "hl-quicknode-evm" : "hl-alchemy-evm";
                          const fallbackId = qnFirst ? "hl-alchemy-evm" : "hl-quicknode-evm";

                          const maxErrorRate = 0.7;
                          const maxBlockHeadLag = 16;

                          const live = upstreams.filter(
                            (u) => u.id === "hl-quicknode-evm" || u.id === "hl-alchemy-evm"
                          );
                          const archive = upstreams.filter(
                            (u) => u.id === "hl-quicknode-nanoreth"
                          );

                          const isHealthy = (u) =>
                            u.metrics.errorRate < maxErrorRate
                            && u.metrics.blockHeadLag < maxBlockHeadLag;

                          const primary = live.find((u) => u.id === primaryId);
                          const fallback = live.find((u) => u.id === fallbackId);

                          const withFallback = (list, other) =>
                            other && !list.some((u) => u.id === other.id)
                              ? list.concat([other])
                              : list;

                          let activeLive = [];
                          let activePrimary = null;
                          if (primary && isHealthy(primary)) {
                            activeLive = withFallback([primary], fallback);
                            activePrimary = primary;
                          } else if (fallback && isHealthy(fallback)) {
                            activeLive = withFallback([fallback], primary);
                            activePrimary = fallback;
                          } else if (primary) {
                            activeLive = withFallback([primary], fallback);
                            activePrimary = primary;
                          } else if (fallback) {
                            activeLive = withFallback([fallback], primary);
                            activePrimary = fallback;
                          } else if (live.length > 0) {
                            activeLive = [live[0]];
                            activePrimary = live[0];
                          }

                          const blockOrLogMethod =
                            method === "eth_getBlockByNumber"
                            || method === "eth_getBlockByHash"
                            || method === "eth_getLogs";

                          // === HYPERLIQUID LIVE MODE (default) ===
                          // QuickNode and Alchemy alternate hourly as the live primary (full HL history, the other is failover).
                          // Nanoreth excluded from block/log methods. (Historically getLogs({ blockHash })
                          // skipped blockAvailability; re-verify on the 0.5.0 canary before relaxing.)
                          // Block + logs must come from ONE upstream: returning a single-element list (no fallback
                          // in the pool) prevents erpc from serving the block from /evm and logs from /alchemy
                          // (or vice-versa), which viem rejects as log.transactionIndex vs block.transactions mismatch.
                          // The chosen upstream is stable for evalInterval (15s); if it errors the request fails
                          // and Ponder retries against the same upstream — preferable to silent cross-provider mixing.
                          if (blockOrLogMethod) {
                            return activePrimary ? [activePrimary] : [];
                          }

                          // === HYPERLIQUID BACKFILL MODE ===
                          // Stop live Ponder on HL (or use a dedicated backfill RPC URL), then:
                          // 1. Comment out the LIVE "if (blockOrLogMethod)" block above.
                          // 2. Uncomment the BACKFILL block below.
                          // 3. Comment out eth_getLogs under hl-quicknode-nanoreth ignoreMethods.
                          // if (method === "eth_getBlockByNumber" || method === "eth_getLogs") {
                          //   return activeLive.concat(archive);
                          // }
                          // if (blockOrLogMethod) {
                          //   return activeLive;
                          // }

                          return activeLive.concat(archive);
                        }
                    failsafe:
                      - matchMethod: "eth_getBlockByNumber|eth_getBlockByHash"
                        timeout:
                          duration: 180s
                        retry:
                          maxAttempts: 1
                          delay: 0ms
                        hedge: null
                      - matchMethod: "eth_getLogs"
                        timeout:
                          duration: 180s
                        retry:
                          maxAttempts: 2
                          delay: 0ms
                        hedge: null
                      - matchMethod: "*"
                        timeout:
                          duration: 30s
                        retry:
                          maxAttempts: 2
                          delay: 250ms
                          backoffFactor: 2
                        hedge: null
                  - architecture: evm
                    evm:
                      chainId: 998
                      fallbackFinalityDepth: 10
                  - architecture: evm
                    evm:
                      chainId: 42161
                      fallbackFinalityDepth: 20
                  - architecture: evm
                    evm:
                      chainId: 8453
                      fallbackFinalityDepth: 3
                  - architecture: evm
                    evm:
                      chainId: 84532
                      fallbackFinalityDepth: 3
                  - architecture: evm
                    evm:
                      chainId: 98866
                      fallbackFinalityDepth: 10
                  - architecture: evm
                    evm:
                      chainId: 196
                      fallbackFinalityDepth: 10
                  - architecture: evm
                    evm:
                      chainId: 5042
                      fallbackFinalityDepth: 10
                  # Avalanche (43114): provider-generated QN/Alchemy/dRPC. One coherent
                  # primary per hour so block + getLogs never mix vendors (Ponder/viem).
                  # evalScope:network evaluates method as "*", so the policy always
                  # returns a single-element list.
                  - architecture: evm
                    evm:
                      chainId: 43114
                      fallbackFinalityDepth: 10
                    selectionPolicy:
                      evalInterval: 15s
                      # 0.5.0: one eval slot per network (ctx.method is "*"),
                      # replacing the legacy evalPerMethod:false / resampleExcluded.
                      evalScope: network
                      evalFunc: |
                        (upstreams, ctx) => {
                          const maxErrorRate = 0.7;
                          const maxBlockHeadLag = 16;
                          const vendorOrder = ["quicknode", "alchemy", "drpc"];

                          const isAvax = (u) =>
                            typeof u.id === "string" && u.id.indexOf("evm:43114") !== -1;
                          const vendorOf = (id) => {
                            if (id.indexOf("quicknode-") === 0) return "quicknode";
                            if (id.indexOf("alchemy-") === 0) return "alchemy";
                            if (id.indexOf("drpc-") === 0) return "drpc";
                            return null;
                          };
                          const isHealthy = (u) =>
                            u.metrics.errorRate < maxErrorRate
                            && u.metrics.blockHeadLag < maxBlockHeadLag;

                          const avax = upstreams.filter(isAvax);
                          const byVendor = {};
                          for (const u of avax) {
                            const v = vendorOf(u.id);
                            if (!v) continue;
                            if (!byVendor[v]) byVendor[v] = [];
                            byVendor[v].push(u);
                          }
                          const present = vendorOrder.filter(
                            (v) => byVendor[v] && byVendor[v].length > 0
                          );
                          if (present.length === 0) {
                            return avax;
                          }

                          const hourSlot = Math.floor(Date.now() / 3600000);
                          const preferredIdx = (hourSlot + 1) % present.length;
                          let activePrimary = null;
                          for (let i = 0; i < present.length; i++) {
                            const v = present[(preferredIdx + i) % present.length];
                            const healthy = byVendor[v].find(isHealthy);
                            if (healthy) {
                              activePrimary = healthy;
                              break;
                            }
                          }
                          if (!activePrimary) {
                            activePrimary = byVendor[present[preferredIdx]][0];
                          }

                          // Single primary for every method: evalScope:network
                          // always evaluates method as "*". A multi-vendor pool would
                          // mix eth_getBlockByNumber and eth_getLogs across providers.
                          return activePrimary ? [activePrimary] : [];
                        }
                upstreams:
                  - id: hl-quicknode-evm
                    endpoint: '${QUICKNODE_HYPE_RPC}/evm'
                    failsafe:
                      - matchMethod: "eth_getBlockByNumber|eth_getBlockByHash"
                        timeout:
                          duration: 180s
                        retry:
                          maxAttempts: 1
                          delay: 0ms
                        hedge: null
                      - matchMethod: "eth_getLogs"
                        timeout:
                          duration: 180s
                        retry:
                          maxAttempts: 2
                          delay: 0ms
                        hedge: null
                    routing:
                      scoreMultipliers:
                        - overall: 1
                    evm:
                      chainId: 999
                      getLogsAutoSplittingRangeThreshold: 1000
                      blockAvailability:
                        lower:
                          latestBlockMinus: 180000
                        upper:
                          latestBlockMinus: 0

                  - id: hl-quicknode-nanoreth
                    endpoint: '${QUICKNODE_HYPE_RPC}/nanoreth'
                    ignoreMethods:
                      - eth_getBlockByHash
                      - eth_getLogs
                      # BACKFILL: comment out eth_getLogs above so nanoreth can serve cold range getLogs.
                    failsafe:
                      - matchMethod: "eth_getBlockByNumber|eth_getBlockByHash|eth_getLogs"
                        timeout:
                          duration: 180s
                        retry:
                          maxAttempts: 1
                          delay: 0ms
                        hedge: null
                    routing:
                      scoreMultipliers:
                        - overall: 1
                    evm:
                      chainId: 999
                      blockAvailability:
                        upper:
                          latestBlockMinus: 1024

                  - id: hl-alchemy-evm
                    endpoint: 'https://hyperliquid-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}'
                    failsafe:
                      - matchMethod: "eth_getBlockByNumber|eth_getBlockByHash"
                        timeout:
                          duration: 180s
                        retry:
                          maxAttempts: 1
                          delay: 0ms
                        hedge: null
                      - matchMethod: "eth_getLogs"
                        timeout:
                          duration: 180s
                        retry:
                          maxAttempts: 2
                          delay: 0ms
                        hedge: null
                    routing:
                      scoreMultipliers:
                        - overall: 1
                    evm:
                      chainId: 999
                      getLogsAutoSplittingRangeThreshold: 1000
                      blockAvailability:
                        upper:
                          latestBlockMinus: 0
                  # Hyperliquid testnet (998): explicit testnet upstreams; QN/Alchemy provider-generated ones are ignored.
                  - endpoint: ${QUICKNODE_HYPE_TESTNET_RPC}/evm
                    evm:
                      chainId: 998
                  - endpoint: 'https://hyperliquid-testnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}' #evm
                    evm:
                      chainId: 998
                  - endpoint: https://rpc.plume.org/${CONDUIT_API_KEY}
                    evm:
                      chainId: 98866
                  - endpoint: https://pharos-mainnet.g.alchemy.com/v2/${PHAROS_API_KEY}
                    evm:
                      chainId: 1672
                  - endpoint: 'https://arc-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}'
                    evm:
                      chainId: 5042
                  - endpoint: https://lb.drpc.live/arc/${DRPC_API_KEY}
                    evm:
                      chainId: 5042
                  - id: monad-historical
                    endpoint: https://rpc-mainnet.monadinfra.com
                    evm:
                      chainId: 143
                    allowMethods:
                      - eth_call
                  # Monad eth_getLogs: the vendors cap the log range, so split proactively
                  # at 1000 blocks per upstream. The network hard cap stays at the project
                  # default (it is a client limit, never a split trigger). These are explicit
                  # because a per-chain provider override would overlap "evm:*", whose first
                  # match is nondeterministic.
