# Argo CD Application: event-lake indexer for testnet (eu main cluster).
# Namespace: cfg-api. Sync wave 1 (after Redpanda topics/schemas).
#
# Helm values live in centrifuge/event-lake environments/test.yaml (chain list
# and registry URL follow api-v3 environments/test.yaml). RPC is in-cluster eRPC.
# Optional override: set global.apiSecretName (see examples/secrets/cfg-api-v4-event-lake-rpc.yaml).
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cfg-api-v4-event-lake-test
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: cfg-api
  sources:
    - repoURL: https://embrio-tech.github.io/centrifuge-helm
      targetRevision: "0.1.0"
      chart: centrifuge-api-v4-event-lake
      helm:
        releaseName: cfg-api-v4-event-lake-test
        valueFiles:
          - $values/environments/test.yaml
    - repoURL: https://github.com/centrifuge/event-lake.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cfg-api
