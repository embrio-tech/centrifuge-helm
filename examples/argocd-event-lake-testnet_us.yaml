# Argo CD Application: event-lake indexer for testnet (us cluster beta).
# Namespace: cfg-event-lake. Sync wave 1 (after Redpanda topics/schemas).
#
# Required pre-deployed Secret `event-lake-testnet-secrets` (in cfg-event-lake namespace):
#   - ENVIO_RPC_URL_<chainId> for every chain in SELECTED_NETWORKS (11155111,84532)
#   - ENVIO_API_TOKEN (optional, HyperSync)
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: event-lake-testnet-us
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: cfg-api
  source:
    repoURL: https://embrio-tech.github.io/centrifuge-helm
    targetRevision: "0.1.0"
    chart: centrifuge-event-lake
    helm:
      releaseName: event-lake-testnet
      values: |
        global:
          env:
            CFG_NETWORK: "testnet"
            SELECTED_NETWORKS: "11155111,84532"
        indexer:
          image:
            tag: "<PINNED_TAG>"            # e.g. sha-xxxxxxx or semver; never latest in prod
        postgres:
          enabled: true
          cluster:
            storage:
              storageClass: perf3
  destination:
    name: beta
    namespace: cfg-event-lake
