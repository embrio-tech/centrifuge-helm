# Argo CD Application: public-api (PostGraphile) + chain-event-handlers for mainnet (us cluster beta).
# Namespace: cfg-event-lake. Sync wave 1 (after Redpanda).
# query runs Drizzle migrations at boot; handlers wait for PUBLIC_API_HEALTH_URL then replay Kafka.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: public-api-mainnet-us
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: cfg-api
  source:
    repoURL: https://embrio-tech.github.io/centrifuge-helm
    targetRevision: "0.1.0"
    chart: centrifuge-public-api
    helm:
      releaseName: public-api-mainnet
      values: |
        global:
          env:
            CFG_NETWORK: "mainnet"
            REDPANDA_BROKERS: "redpanda:9093"
        query:
          image:
            tag: "<PINNED_TAG>"
          ingress:
            enabled: true
            hosts:
              - host: api.cfg-us.embrio.tech
                paths:
                  - path: /
                    pathType: Prefix
            tls:
              - secretName: api-cfg-us-embrio-tech-tls
                hosts:
                  - api.cfg-us.embrio.tech
        handlers:
          image:
            tag: "<PINNED_TAG>"
        postgres:
          enabled: true
          cluster:
            storage:
              storageClass: perf3
  destination:
    name: beta
    namespace: cfg-event-lake
