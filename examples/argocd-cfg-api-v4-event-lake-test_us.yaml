# Argo CD Application: event-lake indexer for testnet (us cluster beta).
# Namespace: cfg-api. Sync wave 1 (after Redpanda topics/schemas).
#
# Helm values live in centrifuge/event-lake environments/test-us.yaml (chain list
# and registry URL follow api-v3 environments/test-us.yaml). erpc.urlTemplate
# points at this cluster's cfg-api-erpc-us Service.
# ENVIO_API_TOKEN comes from Secret cfg-api-v4-event-lake-rpc-overrides
# (global.apiSecretName in the env file).
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cfg-api-v4-event-lake-test-us
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: cfg-api
  sources:
    - repoURL: https://embrio-tech.github.io/centrifuge-helm
      targetRevision: "0.1.0"
      chart: centrifuge-api-v4-event-lake
      helm:
        releaseName: cfg-api-v4-event-lake-test-us
        valueFiles:
          - $values/environments/test-us.yaml
    - repoURL: https://github.com/centrifuge/event-lake.git
      targetRevision: main
      ref: values
  destination:
    name: beta
    namespace: cfg-api
