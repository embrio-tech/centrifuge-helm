# Argo CD Application: public-api (PostGraphile) + chain-event-handlers for mainnet (us cluster beta).
# Namespace: cfg-api. Sync wave 1 (after Redpanda).
# Helm values live in centrifuge/backend environments/main-us.yaml.
# query runs Drizzle migrations at boot; handlers wait for PUBLIC_API_HEALTH_URL then replay Kafka.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cfg-api-v4-public-main-us
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: cfg-api
  sources:
    - repoURL: https://embrio-tech.github.io/centrifuge-helm
      targetRevision: "0.1.0"
      chart: centrifuge-api-v4-public
      helm:
        releaseName: cfg-api-v4-public-main-us
        valueFiles:
          - $values/environments/main-us.yaml
    - repoURL: https://github.com/centrifuge/backend.git
      targetRevision: main
      ref: values
  destination:
    name: beta
    namespace: cfg-api
